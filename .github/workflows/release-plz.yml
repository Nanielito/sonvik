name: Release preparation

on:
  push:
    branches: [main]

jobs:
  release:
    name: Publish merged release PR
    if: github.repository == 'Nanielito/sonvik'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # Tags created with the default token cannot trigger the dist workflow.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Prepare release PR
    if: github.repository == 'Nanielito/sonvik'
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
